name: nightshift

services:
  nightshift:
    build: .
    image: nightshift:local
    env_file: .env
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    volumes:
      - nightshift-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nightshift-data:
