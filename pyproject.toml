[project]
name = "afterhours-discord-bot"
version = "0.1.0"
description = "The Afterhours community Discord bot"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MPL-2.0"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Afterhours Crew" }]
dependencies = [
    "discord-py==2.7.1",
]

[project.scripts]
afterhours-bot = "afterhours_bot.__main__:main"

[build-system]
requires = ["uv_build==0.12.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "afterhours_bot"

[tool.uv]
required-version = "==0.12.9"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]
